<title>Mazarus Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a 480px HUD column over a slow nebula. Each module is a boxed console with its own category hue;
   five tabs (Today · Map · Gear · Journal · Money) in a fixed glass dock. */
:root {
  --void: #05070d;
  --glass: rgba(150, 175, 255, 0.05);
  --glass-hi: rgba(150, 175, 255, 0.10);
  --edge: rgba(170, 195, 255, 0.12);
  --edge-hi: rgba(170, 220, 255, 0.30);
  --ink: #e6ecff;
  --ink-2: #9ba6c6;
  --ink-3: #5f6a8a;
  --ice: #8be9ff;
  --violet: #a996ff;
  --rose: #ff8fc7;
  --amber: #ffc773;
  --jade: #6ff0c0;
  --bad: #ff7d8f;
  --grad: linear-gradient(120deg, var(--ice), var(--violet) 55%, var(--rose));
  --f-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --f-body: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 18px;
  --r-sm: 11px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); }
body {
  background: var(--void); color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.5; font-weight: 300; -webkit-font-smoothing: antialiased;
  min-height: 100%; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(5,7,13,.9); }
.nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.nebula i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 28s ease-in-out infinite alternate; }
.nebula i:nth-child(1) { width: 420px; height: 420px; left: -160px; top: -120px; background: radial-gradient(circle, rgba(80,120,255,.55), transparent 70%); }
.nebula i:nth-child(2) { width: 380px; height: 380px; right: -170px; top: 30%; background: radial-gradient(circle, rgba(170,110,255,.45), transparent 70%); animation-delay: -9s; }
.nebula i:nth-child(3) { width: 360px; height: 360px; left: 10%; bottom: -200px; background: radial-gradient(circle, rgba(60,220,255,.30), transparent 70%); animation-delay: -17s; }
.nebula::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.5) .6px, transparent .7px); background-size: 46px 46px; opacity: .07; mask-image: linear-gradient(to bottom, #000, transparent 80%); }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .nebula i, .fx, .levelup { animation: none !important; } * { transition: none !important; } }

.app {
  position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px));
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 12px;
  background: linear-gradient(to bottom, rgba(5,7,13,.94) 60%, rgba(5,7,13,0));
}
.brand { font-family: var(--f-display); font-size: 11.5px; letter-spacing: .28em; text-transform: uppercase; }
.brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 400; }
.sync { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.sync[data-s="saved"]::before { background: var(--jade); box-shadow: 0 0 8px var(--jade); }
.sync[data-s="saving"]::before { background: var(--amber); }
.sync[data-s="local"]::before { background: var(--violet); }
.sync[data-s="error"]::before { background: var(--bad); }

/* ---------- Primitives ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.small { font-size: 12.5px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.verse { font-style: italic; color: var(--ink-2); font-size: 13px; }
.label { font-family: var(--f-display); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.section-title { font-family: var(--f-display); font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); padding: 8px 2px 0; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--ice); outline-offset: 2px; border-radius: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--edge-hi);
  background: var(--glass-hi); font-size: 13.5px; font-weight: 500;
}
.btn.primary { border: 0; color: #071020; background: var(--grad); }
.btn.ghost { background: transparent; border-color: var(--edge); color: var(--ink-2); }
.btn.sm { min-height: 32px; padding: 0 13px; font-size: 12px; }
.btn.block { width: 100%; }
.btn:active { transform: scale(.98); }
.btn svg { width: 15px; height: 15px; }
.x { background: none; border: 0; color: var(--ink-3); min-width: 30px; height: 30px; border-radius: 50%; }
.x svg { width: 18px; height: 18px; }

input, textarea, select {
  font: inherit; color: var(--ink); width: 100%;
  background: rgba(10,14,30,.6); border: 1px solid var(--edge); border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 15px; font-weight: 300;
}
textarea { resize: vertical; min-height: 44px; line-height: 1.45; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--edge-hi); background: rgba(14,20,42,.75); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-2); }
.field.bad input, .field.bad textarea, .field.bad .ck .tick { border-color: var(--bad); }
.field.bad > span:first-child { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.money { position: relative; }
.money input { padding-left: 24px; font-family: var(--f-mono); }
.money::before { content: "$"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-family: var(--f-mono); font-size: 14px; }
.suffix { position: relative; }
.suffix input { padding-right: 30px; font-family: var(--f-mono); }
.suffix::after { content: attr(data-s); position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-family: var(--f-mono); font-size: 13px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--ink-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { color: #071020; background: var(--grad); border-color: transparent; font-weight: 500; }
.chip svg { width: 13px; height: 13px; }
.energy .chip { width: 44px; justify-content: center; font-family: var(--f-mono); padding: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; border: 1px solid var(--edge); color: var(--ink-2); font-family: var(--f-mono); white-space: nowrap; }
.pill.xp { color: var(--amber); border-color: rgba(255,199,115,.3); }
.pill.done { color: var(--jade); border-color: rgba(111,240,192,.35); }
.pill.now { color: var(--ice); border-color: rgba(139,233,255,.35); }
.pill.lock { color: var(--ink-3); }
.pill.bad { color: var(--bad); border-color: rgba(255,125,143,.35); }
.bar { height: 5px; border-radius: 3px; background: rgba(170,195,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--grad); border-radius: 3px; transition: width .5s; }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th, table.t td { padding: 7px 6px; text-align: left; border-bottom: 1px solid rgba(170,195,255,.07); white-space: nowrap; }
table.t th { font-family: var(--f-display); font-weight: 400; font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
table.t td.n { font-family: var(--f-mono); text-align: right; }

/* ---------- Module: a boxed console with a category hue ---------- */
.mod {
  --hue: var(--ice);
  position: relative; border-radius: var(--r); border: 1px solid var(--edge);
  background: linear-gradient(180deg, color-mix(in srgb, var(--hue) 7%, transparent), rgba(150,175,255,.03) 46%);
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  overflow: hidden;
}
.mod::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--hue), transparent); opacity: .7; }
.mod.log { --hue: var(--ice); }
.mod.mission { --hue: var(--violet); }
.mod.focus { --hue: var(--jade); }
.mod.journal { --hue: var(--rose); }
.mod.ritual { --hue: var(--amber); }
.mod.money { --hue: var(--jade); }
.mod.neutral { --hue: rgba(170,195,255,.6); }
.mod-h { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 15px 16px 12px; }
.mod-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--hue); background: color-mix(in srgb, var(--hue) 12%, transparent); border: 1px solid color-mix(in srgb, var(--hue) 28%, transparent); }
.mod-ic svg { width: 18px; height: 18px; }
.mod-t { min-width: 0; }
.mod-t b { display: block; font-family: var(--f-display); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 400; line-height: 1.5; }
.mod-t span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.mod-b { padding: 0 16px 16px; }
.mod-f { padding: 12px 16px; border-top: 1px solid var(--edge); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mod.complete .mod-ic { background: color-mix(in srgb, var(--hue) 30%, transparent); }

/* Steps inside a module */
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 14px; background: rgba(8,12,26,.45); border: 1px solid rgba(170,195,255,.07); }
.step .num { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--edge-hi); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); margin-top: 1px; }
.step.ok .num { background: var(--hue, var(--ice)); color: #071020; border-color: transparent; }
.step .num svg { width: 12px; height: 12px; }
.step > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.step .q { font-size: 13.5px; font-weight: 500; }

/* Mission rows */
.missions { display: flex; flex-direction: column; gap: 8px; }
.mrow {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
  padding: 11px 12px; border-radius: 14px; background: rgba(8,12,26,.45); border: 1px solid rgba(170,195,255,.08);
}
.mrow:hover { border-color: var(--edge-hi); }
.mrow .mi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(169,150,255,.12); color: var(--violet); }
.mrow .mi svg { width: 16px; height: 16px; }
.mrow.rec .mi { background: rgba(139,233,255,.10); color: var(--ice); }
.mrow.done .mi { background: var(--grad); color: #071020; }
.mrow .mt { min-width: 0; font-size: 13.5px; line-height: 1.4; }
.mrow .mt small { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); margin-top: 3px; letter-spacing: .04em; }
.mrow.done .mt { color: var(--ink-2); }

/* Pilot card */
.pilot { padding: 16px; display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.hex { width: 64px; height: 64px; position: relative; display: grid; place-items: center; }
.hex svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hex b { position: relative; font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.hex small { position: absolute; bottom: 9px; font-family: var(--f-mono); font-size: 7.5px; letter-spacing: .14em; color: var(--ink-3); }
.rank { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; grid-column: 1 / -1; }
.stat { padding: 9px 10px; border-radius: 12px; background: rgba(8,12,26,.45); border: 1px solid rgba(170,195,255,.07); min-width: 0; }
.stat b { display: block; font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.stat span { font-size: 10.5px; color: var(--ink-3); }

.dots { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; }
.dots i { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: rgba(170,195,255,.09); border: 1px solid transparent; }
.dots i.on { background: var(--grad); }
.dots i.rest { border-color: var(--violet); }
.dots i.miss { border-color: rgba(255,125,143,.45); }
.dots i.today { box-shadow: 0 0 0 2px var(--void), 0 0 0 3px var(--ice); }

/* Ticks */
.focus-row { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: center; }
.tick { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--edge-hi); background: transparent; display: grid; place-items: center; padding: 0; flex: none; }
.tick svg { width: 12px; height: 12px; opacity: 0; }
.tick[aria-checked="true"] { background: var(--grad); border-color: transparent; }
.tick[aria-checked="true"] svg { opacity: 1; }
.focus-row input { background: transparent; border: 0; border-bottom: 1px solid var(--edge); border-radius: 0; padding: 8px 0; }
.focus-row input:focus { background: transparent; border-bottom-color: var(--jade); }
.focus-row.done input { color: var(--ink-3); text-decoration: line-through; }
.ck { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 9px 0; background: none; border: 0; border-bottom: 1px solid rgba(170,195,255,.06); font-size: 14px; }
.ck:last-child { border-bottom: 0; }
.ck .tick { pointer-events: none; }

/* Map */
.map { position: relative; padding: 6px 0 4px; }
.map::before { content: ""; position: absolute; left: 31px; top: 36px; bottom: 36px; width: 2px; background: linear-gradient(to bottom, var(--ice), var(--violet), rgba(170,195,255,.12)); opacity: .5; }
.node { position: relative; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 6px 10px 6px 0; background: none; border: 0; border-radius: 16px; }
.node .orb { width: 64px; height: 64px; display: grid; place-items: center; position: relative; }
.node .orb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node .orb b { position: relative; font-family: var(--f-display); font-size: 15px; font-weight: 400; display: grid; place-items: center; }
.node .nt { min-width: 0; }
.node .nt b { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 400; }
.node .nt span { display: block; font-size: 12px; color: var(--ink-2); }
.node .nt small { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.node.sel { background: rgba(139,233,255,.07); }
.node.locked .orb b, .node.locked .nt b { color: var(--ink-3); }
.boss-hp { display: flex; gap: 4px; }
.boss-hp i { flex: 1; height: 8px; border-radius: 2px; background: linear-gradient(90deg, var(--bad), var(--rose)); }
.boss-hp i.hit { background: rgba(170,195,255,.1); }
.wp { border-radius: 14px; background: rgba(8,12,26,.3); border: 1px solid rgba(170,195,255,.07); padding: 12px; }
.wp.now { border-color: rgba(139,233,255,.35); }
.wp-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.wp-h b { font-size: 13.5px; font-weight: 500; }
.trophies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trophy { padding: 12px 8px; border-radius: 14px; border: 1px solid var(--edge); background: transparent; text-align: center; font-size: 11.5px; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 6px; line-height: 1.3; min-width: 0; }
.trophy svg { width: 22px; height: 22px; }
.trophy.won { color: var(--ink); border-color: rgba(255,199,115,.4); background: radial-gradient(circle at 50% 0, rgba(255,199,115,.16), transparent 70%); }
.trophy.won svg { color: var(--amber); }

/* Gear */
.gear-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gear { position: relative; padding: 14px 8px 12px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(8,12,26,.4); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.gear .gi { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--ink-3); border: 1px dashed rgba(170,195,255,.22); }
.gear .gi svg { width: 22px; height: 22px; }
.gear b { font-family: var(--f-display); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; font-weight: 400; color: var(--ink-3); }
.gear span { font-size: 10.5px; color: var(--ink-3); line-height: 1.25; }
.gear.on { border-color: var(--edge-hi); background: radial-gradient(circle at 50% 0, rgba(139,233,255,.14), rgba(8,12,26,.4) 70%); }
.gear.on .gi { color: #071020; background: var(--grad); border: 0; box-shadow: 0 0 18px rgba(139,233,255,.25); }
.gear.on b { color: var(--ink); }
.gear.on span { color: var(--ink-2); }
.gear .lv { position: absolute; top: 8px; right: 8px; font-family: var(--f-mono); font-size: 9px; color: var(--amber); }
.stones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stone { aspect-ratio: 1; max-width: 100%; min-width: 0; overflow: hidden; border-radius: 16px; border: 1px solid var(--edge); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; text-align: center; }
.stone .n { font-family: var(--f-display); font-size: 15px; color: var(--ink-3); }
.stone .t { font-size: 9px; line-height: 1.2; color: var(--ink-3); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.stone.laid { background: radial-gradient(circle at 30% 25%, rgba(139,233,255,.28), rgba(169,150,255,.12) 60%, transparent); border-color: var(--edge-hi); }
.stone.laid .n { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stone.laid .t { color: var(--ink-2); }
.record { display: flex; flex-direction: column; gap: 12px; }
.record .rf > span { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 2px; }
.record .rf p { white-space: pre-wrap; font-size: 14px; }

/* Money */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 14px; min-width: 0; border-radius: 16px; background: rgba(8,12,26,.45); border: 1px solid rgba(170,195,255,.08); }
.tile.wide { grid-column: 1 / -1; }
.tile .v { font-family: var(--f-mono); font-size: 21px; font-weight: 500; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.split { display: flex; flex-direction: column; gap: 8px; }
.split .ln { display: grid; grid-template-columns: 82px 1fr 82px; gap: 10px; align-items: center; font-size: 13px; }
.split .ln .bar { height: 6px; }
.split .ln .amt { font-family: var(--f-mono); text-align: right; }
.split .ln .nm { color: var(--ink-2); }
.split .give .bar i { background: linear-gradient(90deg, var(--rose), var(--violet)); }
.split .tax .bar i { background: linear-gradient(90deg, #7f8bb0, #a8b2d6); }
.split .salary .bar i { background: linear-gradient(90deg, var(--ice), #6fb6ff); }
.split .debt .bar i { background: linear-gradient(90deg, var(--amber), #ff9f7a); }
.split .emergency .bar i { background: linear-gradient(90deg, var(--jade), var(--ice)); }
.split .invest .bar i { background: linear-gradient(90deg, var(--violet), #c3b6ff); }
.gate { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(170,195,255,.06); }

   ============================================================ */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const todayISO = () => iso(new Date());
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmtDay = s => { if (!s) return ""; const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtMonth = ym => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
const monthOf = s => s.slice(0, 7);
const addMonths = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const weekKey = s => addDays(s, (7 - parse(s).getDay()) % 7);
const TOTAL_DAYS = diffDays(PLAN_START, PLAN_END) + 1;
const phaseFor = s => s < PLAN_START ? PHASES[0] : (PHASES.find(p => s >= p.start && s <= p.end) || PHASES[4]);
function activeGroup(s) {
  const p = phaseFor(s);
  if (s < PLAN_START) return { p, gi: 0 };
  const gi = p.groups.findIndex(g => s >= g.from && s <= g.to);
  return { p, gi: gi < 0 ? p.groups.length - 1 : gi };
}

/* ============================================================
   STORE — db capability (private per person) with device fallback
   ============================================================ */
const COLLS = ["days", "reviews", "records"];
const blankState = () => ({ settings: {}, checks: {}, receipts: [], snaps: [], stones: {}, gates: {} });
const S = { state: blankState(), days: {}, reviews: {}, records: {}, backend: null, base: null, pending: {}, ready: false };
const clone = o => JSON.parse(JSON.stringify(o || {}));

const LocalBackend = {
  kind: "local",
  key: p => "mazarus:" + p,
  async set(path, data) { try { localStorage.setItem(this.key(path), JSON.stringify(data)); } catch (e) { throw { code: "unavailable" }; } },
  async loadAll(base) {
    const out = { state: null, days: {}, reviews: {}, records: {} };
    try {
      const pre = "mazarus:" + base;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith(pre)) continue;
        const rest = k.slice(pre.length), v = JSON.parse(localStorage.getItem(k));
        if (rest === "") out.state = v;
        else { const [, c, id] = rest.split("/"); if (out[c] && id) out[c][id] = v; }
      }
    } catch (e) {}
    return out;
  }
};
function DbBackend(db) {
  return {
    kind: "db",
    async set(path, data) { await db.doc(path).set(data); },
    async loadAll(base) {
      const ref = db.doc(base);
      const [st, ...cs] = await Promise.all([ref.get(), ...COLLS.map(c => ref.collection(c).limit(1000).get())]);
      const out = { state: st.exists ? clone(st.data()) : null };
      COLLS.forEach((c, i) => { out[c] = {}; cs[i].docs.forEach(d => { out[c][d.id] = clone(d.data()); }); });
      return out;
    },
    watch(base, onChange) {
      const ref = db.doc(base);
      ref.onSnapshot(snap => {
        if (snap.metadata.hasPendingWrites || S.pending[base] || !snap.exists) return;
        S.state = Object.assign(blankState(), clone(snap.data())); onChange();
      }, () => {});
      COLLS.forEach(c => ref.collection(c).limit(1000).onSnapshot(q => {
        if (q.metadata.hasPendingWrites) return;
        let changed = false;
        q.docChanges().forEach(ch => {
          if (S.pending[base + "/" + c + "/" + ch.doc.id]) return;
          if (ch.type === "removed") delete S[c][ch.doc.id]; else S[c][ch.doc.id] = clone(ch.doc.data());
          changed = true;
        });
        if (changed) onChange();
      }, () => {}));
    }
  };
}
function setSync(s, text) { const el = document.getElementById("sync"); el.dataset.s = s; el.textContent = text; }
function syncIdle() {
  if (Object.keys(S.pending).length) return;
  if (S.backend.kind === "db") setSync("saved", "Saved"); else setSync("local", "On this device");
}
function queueSave(path, getData, delay = 700) {
  const e = S.pending[path] || (S.pending[path] = { v: 0 });
  e.get = getData; e.v++;
  clearTimeout(e.timer);
  setSync("saving", "Saving");
  e.timer = setTimeout(() => flush(path), delay);
}
async function flush(path) {
  const e = S.pending[path];
  if (!e) return;
  if (e.inflight) { e.again = true; return; }
  e.inflight = true;
  const v = e.v;
  let ok = true;
  try { await S.backend.set(path, clone(e.get())); }
  catch (err) {
    ok = false;
    if (err && err.code === "unavailable") {
      await new Promise(r => setTimeout(r, 800 + Math.random() * 800));
      try { await S.backend.set(path, clone(e.get())); ok = true; } catch (_) {}
    }
    if (!ok) setSync("error", err && err.code === "quota_exceeded" ? "Storage full" : "Not saved");
  }
  e.inflight = false;
  if (e.again || e.v !== v) { e.again = false; return flush(path); }
  if (ok) { delete S.pending[path]; syncIdle(); }
}
const saveState = d => queueSave(S.base, () => S.state, d);
const saveIn = (c, id, d) => queueSave(`${S.base}/${c}/${id}`, () => S[c][id] || {}, d);
const saveDay = d => saveIn("days", d);
const saveReview = k => saveIn("reviews", k);
const saveRecord = id => saveIn("records", id, 0);

async function boot() {
  let db = null, uid = null;
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const [dbNs, userNs] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (dbNs && userNs) { uid = await userNs.id(); if (uid) db = dbNs; }
    } catch (e) { db = null; }
  }
  if (db) { S.backend = DbBackend(db); S.base = `data/users/${uid}/state`; }
  else { S.backend = LocalBackend; S.base = "local/state"; }
  let loaded;
  try { loaded = await S.backend.loadAll(S.base); }
  catch (e) { S.backend = LocalBackend; S.base = "local/state"; loaded = await LocalBackend.loadAll(S.base); }
  S.state = Object.assign(blankState(), loaded.state || {});
  COLLS.forEach(c => { S[c] = loaded[c] || {}; });
  S.ready = true;
  lastLevel = levelInfo(computeXP()).level;

}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n, dp = 0) => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-SG", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const kmoney = n => Math.abs(n) >= 1000 ? (n < 0 ? "−$" : "$") + (Math.abs(n) / 1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1) + "k" : money(n);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const done = id => !!S.state.checks[id];

function toast(msg, xp) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");

}
function burst() { const f = document.createElement("div"); f.className = "fx"; document.body.appendChild(f); setTimeout(() => f.remove(), 900); }

/* ---------- Game math (all derived from data, nothing stored) ---------- */
const dayLogSteps = x => { x = x || {}; return [!!String(x.spend ?? "").trim(), !!String(x.gratitude ?? "").trim(), !!x.energy]; };
const hasJournal = x => !!(x && (x.money || x.felt || x.learned || x.thankful));
function dayLogged(d) { const x = S.days[d]; return !!x && (!!x.rest || dayLogSteps(x).some(Boolean) || hasJournal(x)); }
function computeXP() {
  let xp = 0;
  Object.keys(S.state.checks).forEach(id => { const m = MISSIONS[id]; if (m) xp += m.xp; });
  Object.values(S.days).forEach(x => {
    xp += x.rest ? 30 : dayLogSteps(x).filter(Boolean).length * 10;
    xp += (x.focus || []).filter(f => f && f.done && f.t).length * 10;
    if (hasJournal(x)) xp += 20;
  });
  Object.entries(S.reviews).forEach(([k, r]) => { if (r.done) xp += k.startsWith("w-") ? 60 : 120; });
  xp += S.state.receipts.length * 25;
  xp += Object.keys(S.state.stones).length * 100;
  xp += new Set(S.state.snaps.map(s => s.date)).size * 15;
  return xp;
}
const lvlXP = L => 75 * L * (L - 1); // total XP needed to reach level L
function levelInfo(xp) {
  let L = 1; while (lvlXP(L + 1) <= xp) L++;
  const lo = lvlXP(L), hi = lvlXP(L + 1);
  let rank = RANKS[0][1]; RANKS.forEach(([l, r]) => { if (L >= l) rank = r; });
  return { level: L, rank, into: xp - lo, need: hi - lo, xp };
}
function streak() {
  const t = todayISO();
  let d = dayLogged(t) ? t : addDays(t, -1), n = 0, grace = false, missRun = 0;
  for (let i = 0; i < 700; i++) {
    if (dayLogged(d)) { if (missRun) grace = true; n++; missRun = 0; }
    else { missRun++; if (missRun >= 2) break; }
    d = addDays(d, -1);
  }
  return { n, grace };
}
let lastLevel = 1;
function award(before, msg) {
  const after = computeXP(), diff = after - before;
  if (diff > 0) { toast(msg, diff); burst(); }
  const L = levelInfo(after);
  if (L.level > lastLevel) {
    const el = document.createElement("div"); el.className = "levelup";
    el.innerHTML = `<small>LEVEL UP</small><b>Level ${L.level}</b><span class="muted small">${esc(L.rank)}</span>`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2700);

}

/* ---------- Money math ---------- */
const latestSnap = () => S.state.snaps.length ? S.state.snaps[S.state.snaps.length - 1] : null;
const E = () => num(S.state.settings.essentials);
function emergencyNow() { const s = latestSnap(); return s && s.emergency !== "" && s.emergency != null ? num(s.emergency) : null; }
function shieldLevel() {
  const e = E(), em = emergencyNow() || 0;
  const tiers = [["Mk I", 500, "$500"], ["Mk II", 1000, "$1,000"], ["Mk III", e, "1 month"], ["Mk IV", 3 * e, "3 months"], ["Mk V", 3.5 * e, "3.5 months"], ["Mk VI", 4 * e, "4+ months"]];
  let lv = 0; tiers.forEach((t, i) => { if (t[1] > 0 && em >= t[1] && lv === i) lv = i + 1; });
  return { lv, tiers, em, next: tiers[lv] };
}
function incomeByMonth() { const m = {}; S.state.receipts.forEach(r => { const k = monthOf(r.date); m[k] = (m[k] || 0) + num(r.amount); }); return m; }
function avg3(ym) { const m = incomeByMonth(); let s = 0; for (let i = 0; i < 3; i++) s += m[addMonths(ym, -i)] || 0; return s / 3; }
function gates() { const e = E(), em = emergencyNow(); return { g1: !!(e && em !== null && em >= e), g2: !!S.state.gates.g2, g3: !!S.state.gates.g3 }; }
function allocate(amount, dateS) {
  const p = phaseFor(dateS), a = ALLOC[p.n], out = {}, g = gates();
  out.give = amount * a.give / 100; out.tax = amount * a.tax / 100; out.debt = amount * a.debt / 100; out.invest = 0;
  let note = "";
  if (a.invest) { if (g.g1 && g.g2 && g.g3) out.invest = amount * a.invest / 100; else { out.debt += amount * a.invest / 100; note = `Invest ${a.invest}% goes to Debt until Gates 1–3 are green.`; } }
  if (p.n === 0) {
    const ls = latestSnap() || {};
    const have = num(ls.emergency) + S.state.receipts.filter(r => !ls.date || r.date > ls.date).reduce((s, r) => s + num((r.alloc || {}).emergency), 0);
    const rest = amount - out.give - out.tax;
    out.emergency = Math.min(Math.max(0, 500 - have), Math.max(0, rest));
    out.salary = rest - out.emergency;
  } else { out.emergency = amount * a.emergency / 100; out.salary = amount * a.salary / 100; }
  return { out, phase: p, note };
}
const debtRows = () => ((S.records["p0g0i1"] || {}).rows || []).filter(r => r && r.who);
function debtSuggest() {
  const rows = debtRows(); if (!rows.length) return "";
  const late = rows.filter(r => r.status === "late");
  if (late.length) return `Fix late first: ${late.map(r => r.who).join(", ")}.`;
  const hi = rows.filter(r => num(r.rate) > 20).sort((a, b) => num(b.rate) - num(a.rate));
  if (hi.length) return `Highest rate above 20%: ${hi[0].who} (${hi[0].rate}%). That's Debt #1.`;
  const small = rows.slice().sort((a, b) => num(a.bal) - num(b.bal))[0];
  return `Nothing above 20%: clear the smallest first for a quick win (${small.who}, ${money(num(small.bal))}).`;
}

/* ---------- GEAR ---------- */
function gearUnlocked(g) {
  if (g.special === "shield") return shieldLevel().lv > 0;
  if (g.special === "sweep") return S.state.receipts.length > 0;
  return done(g.from);
}
function gearHint(g) {
  if (g.special === "shield") return "Reach $500 in Emergency";
  if (g.special === "sweep") return "Log your first receipt";
  const m = MISSIONS[g.from], p = PHASES[m.p];
  return `${p.groups[m.g].label.split(" — ")[0]} · Sector ${p.n}`;
}
function renderGear() {
  const sh = shieldLevel();
  const cards = GEAR.map(g => {
    const on = gearUnlocked(g);
    const lv = g.special === "shield" && on ? `<span class="lv">${sh.tiers[sh.lv - 1][0]}</span>` : g.special === "sweep" && on ? `<span class="lv">×${S.state.receipts.length}</span>` : "";
    return `<button class="gear ${on ? "on" : ""}" data-act="gear" data-id="${g.id}">${lv}<span class="gi">${I[g.id]}</span><b>${esc(g.name)}</b><span>${on ? esc(g.what) : esc(gearHint(g))}</span></button>`;
  }).join("");
  const stones = STONES.map((s, i) => `<button class="stone ${S.state.stones[i + 1] ? "laid" : ""}" data-act="stone" data-n="${i + 1}" aria-pressed="${!!S.state.stones[i + 1]}"><span class="n">${i + 1}</span><span class="t">${esc(s[0])}</span></button>`).join("");
  return `${pilotCard()}
  <section class="mod mission">${modHead(I.shield, "Loadout", "Each piece is earned by a mission and holds the record you wrote. Tap to open it.", `<span class="pill now">${GEAR.filter(gearUnlocked).length}/12</span>`)}<div class="mod-b"><div class="gear-grid">${cards}</div></div></section>
  <section class="mod journal">${modHead(I.star, "Ebenezer stones", "“Thus far the LORD has helped us.” 1 Sam 7:12", `<span class="pill">${Object.keys(S.state.stones).length}/12</span>`)}<div class="mod-b stack" style="gap:10px"><div class="stones">${stones}</div><p class="small dim">Tap a stone to lay it. Celebrate without spending: a thank-you note, a family walk, a home-cooked meal, the wins jar.</p></div></section>`;

/* ============================================================
   SHEETS
   ============================================================ */
function openSheet(html, onMount) {
  closeSheet(true);
  const bg = document.createElement("div");
  bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  bg.addEventListener("click", ev => { if (ev.target === bg || ev.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(bg);
  onMount && onMount(bg);
}
function closeSheet(silent) {
  const s = document.getElementById("sheet"); if (!s) return;
  s.remove();
  if (!silent && deferredRender) { deferredRender = false; render(); }
}
const sheetHead = (kicker, title, right = "") => `<div class="row between" style="align-items:flex-start"><div class="stack" style="gap:4px;min-width:0"><span class="label">${kicker}</span><h2 style="font-size:17px;font-family:var(--f-body);font-weight:500">${title}</h2></div><div class="row" style="gap:6px">${right}<button class="x" data-close aria-label="Close">✕</button></div></div>`;

/* ---------- Form engine: mission specs → fields → records ---------- */
function fieldHtml(f, v) {
  const id = "f-" + f.k;
  const lab = f.label ? `<span>${esc(f.label)}</span>` : "";
  const val = v ?? f.def ?? "";
  switch (f.type) {
    case "textarea": return `<label class="field" data-f="${f.k}">${lab}<textarea id="${id}" data-k="${f.k}" rows="${f.rows || 3}">${esc(val)}</textarea></label>`;
    case "money": return `<label class="field" data-f="${f.k}">${lab}<div class="money"><input id="${id}" data-k="${f.k}" inputmode="decimal" value="${esc(val)}" placeholder="0"></div></label>`;
    case "number": return `<label class="field" data-f="${f.k}">${lab}<input id="${id}" data-k="${f.k}" inputmode="numeric" value="${esc(val)}" placeholder="0" class="mono"></label>`;
    case "pct": return `<label class="field" data-f="${f.k}">${lab}<div class="suffix" data-s="%"><input id="${id}" data-k="${f.k}" inputmode="decimal" value="${esc(val)}"></div></label>`;
    case "date": return `<label class="field" data-f="${f.k}">${lab}<input id="${id}" type="date" data-k="${f.k}" value="${esc(val)}"></label>`;
    case "sign": return `<label class="field" data-f="${f.k}">${lab}<input id="${id}" data-k="${f.k}" value="${esc(val)}" placeholder="Type your name to sign" style="font-style:italic"></label>`;
    case "debtpick": {
      const rows = debtRows();
      return `<label class="field" data-f="${f.k}">${lab}${rows.length ? `<select id="${id}" data-k="${f.k}"><option value="">Choose a debt</option>${rows.map(r => `<option ${r.who === val ? "selected" : ""}>${esc(r.who)}</option>`).join("")}</select>` : `<input id="${id}" data-k="${f.k}" value="${esc(val)}" placeholder="Lender name">`}<span class="small dim">${esc(debtSuggest() || "Finish the debt inventory (Sector 0, Week 1) to get a suggestion.")}</span></label>`;
    }
    case "checklist": {
      const o = v || {};
      return `<div class="field" data-f="${f.k}">${lab}<div>${f.items.map((it, i) => `<button type="button" class="ck" role="checkbox" aria-checked="${o[i] ? "true" : "false"}" data-ck="${f.k}" data-i="${i}"><span class="tick" aria-checked="${o[i] ? "true" : "false"}">${I.check}</span><span>${esc(it)}</span></button>`).join("")}</div></div>`;
    }
    case "lines": {
      const arr = Array.isArray(v) ? v : [];
      return `<div class="field" data-f="${f.k}">${lab}<div class="stack" style="gap:8px">${Array.from({ length: f.n }, (_, i) => `<div class="row"><span class="mono small dim" style="width:16px">${i + 1}</span><input data-lk="${f.k}" data-i="${i}" value="${esc(arr[i] || "")}" placeholder="Name"></div>`).join("")}</div></div>`;
    }
    case "table": {
      const rows = Array.isArray(v) && v.length ? v : [{}];
      const tpl = f.cols.map(c => c.w || "1fr").join(" ") + " 30px";
      return `<div class="field" data-f="${f.k}"><span>${esc(f.label)}</span>
        <div class="tablewrap"><div style="min-width:440px;gap:6px" class="stack" data-table="${f.k}">
          <div class="trow" style="grid-template-columns:${tpl}">${f.cols.map(c => `<span class="label" style="font-size:8px">${esc(c.label)}</span>`).join("")}<span></span></div>
          ${rows.map((r, ri) => `<div class="trow" style="grid-template-columns:${tpl}" data-row="${ri}">${f.cols.map(c => c.type === "select"
            ? `<select data-c="${c.k}" aria-label="${esc(c.label)}">${c.options.map(o => `<option ${r[c.k] === o ? "selected" : ""}>${o}</option>`).join("")}</select>`
            : `<input data-c="${c.k}" aria-label="${esc(c.label)}" value="${esc(r[c.k] || "")}" ${c.type === "money" ? 'inputmode="decimal" class="mono"' : ""} placeholder="${esc(c.ph || (c.type === "money" ? "0" : ""))}">`).join("")}<button type="button" class="x" data-delrow="${ri}" aria-label="Remove row">✕</button></div>`).join("")}
        </div></div>
        <div class="row between wrap"><button type="button" class="btn sm ghost" data-addrow="${f.k}">${I.plus} Add row</button><span class="mono small" style="color:var(--ice)" data-total="${f.k}"></span></div></div>`;
    }
    default: return `<label class="field" data-f="${f.k}">${lab}<input id="${id}" data-k="${f.k}" value="${esc(val)}"></label>`;
  }
}
function formHtml(form, rec) {
  let out = "", buf = [];
  const flushHalf = () => { if (buf.length) { out += `<div class="grid2">${buf.join("")}</div>`; buf = []; } };
  form.forEach(f => { const h = fieldHtml(f, rec[f.k]); if (f.half) { buf.push(h); if (buf.length === 2) flushHalf(); } else { flushHalf(); out += h; } });
  flushHalf();
  return out;
}
function collect(root, form, draft) {
  form.forEach(f => {
    if (f.type === "checklist") return; // toggled live into draft
    if (f.type === "lines") { draft[f.k] = [...root.querySelectorAll(`[data-lk="${f.k}"]`)].map(i => i.value.trim()); return; }
    if (f.type === "table") { draft[f.k] = [...root.querySelectorAll(`[data-table="${f.k}"] [data-row]`)].map(r => { const o = {}; r.querySelectorAll("[data-c]").forEach(i => { o[i.dataset.c] = i.value.trim(); }); return o; }); return; }
    const el = root.querySelector(`[data-k="${f.k}"]`); if (el) draft[f.k] = el.value;
  });
  return draft;
}
function filled(f, v) {
  if (f.type === "checklist") return f.items.every((_, i) => (v || {})[i]);
  if (f.type === "lines") return (v || []).some(Boolean);
  if (f.type === "table") return (v || []).some(r => r[f.cols[0].k]);
  return String(v ?? "").trim() !== "";
}
function tableTotal(f, rows) {
  rows = rows || [];
  if (f.cols.some(c => c.k === "p")) {
    const sum = rows.reduce((s, r) => s + num(r.val), 0);
    const w = rows.reduce((s, r) => s + num(r.val) * num(r.p) / 100, 0);
    return `Total ${money(sum)} · weighted ${money(Math.round(w))}`;
  }
  const mc = f.cols.find(c => c.type === "money"); if (!mc) return "";
  const sum = rows.reduce((s, r) => s + num(r[mc.k]), 0);
  const mins = f.cols.some(c => c.k === "min") ? rows.reduce((s, r) => s + num(r.min), 0) : null;
  return `Total ${money(sum)}${mins !== null ? ` · minimums ${money(mins)}/mo` : ""}`;
}
const sumFields = (form, rec) => form.filter(f => f.sum).reduce((s, f) => s + num(rec[f.k]), 0);

function applyEffects(m, rec) {
  if (m.fx === "debts") { const tot = (rec.rows || []).reduce((s, r) => s + num(r.bal), 0); if (tot && !num(S.state.settings.startDebt)) S.state.settings.startDebt = String(tot); }
  if (m.fx === "essentials") { const e = sumFields(m.form, rec); if (e) S.state.settings.essentials = String(e); }
  if (m.fx === "partner" && rec.name) S.state.settings.partner = rec.name;
}
function applyCompleteEffects(m) {
  if (m.fx === "stone1" && !S.state.stones[1]) S.state.stones[1] = { date: todayISO(), note: "Day Zero written." };
  if (m.fx === "stone2" && !S.state.stones[2]) S.state.stones[2] = { date: todayISO(), note: "Giving restarted at 5%." };
}

function missionSheet(id) {
  const m = MISSIONS[id]; if (!m) return;
  const p = PHASES[m.p];
  const isDone = done(id);
  const draft = clone(S.records[id] || {});
  const gear = m.gear ? GEAR.find(g => g.id === m.gear) : null;
  const kicker = m.kind === "academy" ? `Academy · ${esc(m.when)}` : m.kind === "milestone" ? `Sector ${m.p} · Achievement` : m.kind === "exit" ? `Sector ${m.p} · Boss: ${esc(p.boss)}` : `Sector ${m.p} · ${esc(p.groups[m.g].label)}`;
  const tags = [`<span class="pill xp">+${m.xp} XP</span>`, m.rec ? `<span class="pill now">Record</span>` : `<span class="pill">Confirm</span>`, gear ? `<span class="pill done">Unlocks ${esc(gear.name)}</span>` : ""].join("");
  const brief = m.brief || (m.kind === "exit" ? "Exit condition: clear it when it's true. Each one cleared takes a point off the boss's HP." : m.kind === "milestone" ? "A sector milestone. Mark it when it's real." : m.rec ? "Record it here. It stays in the app for later." : "Mark it done when it's true. Add a field note if it helps.");
  openSheet(`<div class="stack">
    ${sheetHead(kicker, esc(m.t))}
    <div class="chips">${tags}</div>
    <div class="brief">${esc(brief)}</div>
    <form class="stack" id="mform" style="gap:14px" novalidate>${formHtml(m.form, draft)}</form>
    ${m.form.some(f => f.sum) ? `<div class="row between"><span class="label">Monthly essentials (E)</span><span class="mono" style="color:var(--ice)" id="sumv"></span></div>` : ""}
    ${isDone ? `<p class="small dim">Completed ${esc(fmtDay(S.state.checks[id]))}</p>` : ""}
    <div class="row" style="gap:8px">
      ${isDone ? `<button class="btn ghost" id="m-undo">Mark not done</button><button class="btn primary grow" id="m-save">Save changes</button>`
        : `${m.rec ? `<button class="btn ghost" id="m-draft">Save draft</button>` : ""}<button class="btn primary grow" id="m-done">Complete · +${m.xp} XP</button>`}
    </div>
  </div>`, bg => {
    const fm = bg.querySelector("#mform");
    const paintTotals = () => {
      collect(fm, m.form, draft);
      m.form.filter(f => f.type === "table").forEach(f => { const el = bg.querySelector(`[data-total="${f.k}"]`); if (el) el.textContent = tableTotal(f, draft[f.k]); });
      const sv = bg.querySelector("#sumv"); if (sv) sv.textContent = money(sumFields(m.form, draft));
    };
    const rerenderForm = () => { fm.innerHTML = formHtml(m.form, draft); paintTotals(); };
    fm.addEventListener("input", paintTotals);
    fm.addEventListener("change", paintTotals);
    fm.addEventListener("submit", ev => ev.preventDefault());
    fm.addEventListener("click", ev => {
      const ck = ev.target.closest("[data-ck]");
      if (ck) { const o = draft[ck.dataset.ck] || (draft[ck.dataset.ck] = {}); o[ck.dataset.i] = !o[ck.dataset.i]; const on = o[ck.dataset.i] ? "true" : "false"; ck.setAttribute("aria-checked", on); ck.querySelector(".tick").setAttribute("aria-checked", on); return; }
      const add = ev.target.closest("[data-addrow]");
      if (add) { collect(fm, m.form, draft); (draft[add.dataset.addrow] = draft[add.dataset.addrow] || []).push({}); rerenderForm(); const rows = fm.querySelectorAll(`[data-table="${add.dataset.addrow}"] [data-row]`); const inp = rows[rows.length - 1] && rows[rows.length - 1].querySelector("input"); inp && inp.focus(); return; }
      const del = ev.target.closest("[data-delrow]");
      if (del) { collect(fm, m.form, draft); const tk = del.closest("[data-table]").dataset.table; draft[tk].splice(+del.dataset.delrow, 1); rerenderForm(); }
    });
    paintTotals();
    const persist = () => {
      collect(fm, m.form, draft);
      if (m.rec || draft.note) { S.records[id] = clone(draft); saveRecord(id); }
      applyEffects(m, draft);
    };
    const validate = () => {
      fm.querySelectorAll(".field.bad").forEach(x => x.classList.remove("bad"));
      if (m.sumReq && !sumFields(m.form, draft)) { toast("Add at least one line to get your E"); return false; }
      const miss = m.form.filter(f => f.req && !filled(f, draft[f.k]));
      if (!miss.length) return true;
      miss.forEach(f => { const el = fm.querySelector(`[data-f="${f.k}"]`); el && el.classList.add("bad"); });
      const first = fm.querySelector(".field.bad"); first && first.scrollIntoView({ block: "center", behavior: "smooth" });
      toast(`Still needed: ${miss.map(f => f.label || "the checkbox").join(", ")}`);
      return false;
    };
    const btnDone = bg.querySelector("#m-done");
    if (btnDone) btnDone.onclick = () => {
      collect(fm, m.form, draft);
      if (!validate()) return;
      const before = computeXP();
      persist();
      S.state.checks[id] = todayISO();
      applyCompleteEffects(m);
      saveState(0); closeSheet(); render();
      award(before, gear ? `${gear.name} equipped` : m.kind === "exit" ? "Boss hit" : m.kind === "milestone" ? "Achievement unlocked" : "Mission complete");
    };
    const btnDraft = bg.querySelector("#m-draft");
    if (btnDraft) btnDraft.onclick = () => { persist(); saveState(); closeSheet(); render(); toast("Draft saved"); };
    const btnSave = bg.querySelector("#m-save");
    if (btnSave) btnSave.onclick = () => { collect(fm, m.form, draft); if (!validate()) return; persist(); saveState(); closeSheet(); render(); toast("Saved"); };
    const btnUndo = bg.querySelector("#m-undo");
    if (btnUndo) btnUndo.onclick = () => {
      if (btnUndo.dataset.c !== "1") { btnUndo.dataset.c = "1"; btnUndo.textContent = "Tap again to confirm"; return; }
      delete S.state.checks[id]; saveState(0); closeSheet(); render(); resyncLevel(); toast("Marked not done");
    };
  });
}

function recordView(m, rec) {
  return `<div class="record">${m.form.map(f => {
    const v = rec[f.k];
    let body;
    if (f.type === "checklist") { const on = f.items.filter((_, i) => (v || {})[i]); if (!on.length) return ""; body = esc(on.join(" · ")); }
    else if (!filled(f, v)) return "";
    else if (f.type === "lines") body = esc((v || []).filter(Boolean).join(", "));
    else if (f.type === "table") {
      const rows = (v || []).filter(r => r[f.cols[0].k]);
      return `<div class="rf"><span>${esc(f.label)}</span><div class="tablewrap"><table class="t"><thead><tr>${f.cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${f.cols.map(c => `<td class="${c.type === "money" ? "n" : ""}">${c.type === "money" && r[c.k] ? money(num(r[c.k])) : esc(r[c.k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="small mono" style="color:var(--ice);margin-top:6px">${esc(tableTotal(f, rows))}</p></div>`;
    }
    else if (f.type === "money") body = money(num(v));
    else if (f.type === "date") body = esc(fmtDay(v));
    else body = esc(v);
    return `<div class="rf"><span>${esc(f.label || "")}</span><p>${body}</p></div>`;
  }).join("")}${m.form.some(f => f.sum) ? `<div class="rf"><span>Monthly essentials (E)</span><p class="mono" style="color:var(--ice)">${money(sumFields(m.form, rec))}</p></div>` : ""}</div>`;
}

function receiptSheet() {

    <div class="grid2">

      bg.querySelector("#r-split").innerHTML = BUCKETS.map(([k, l]) => `<div class="ln ${k}"><span class="nm">${l}</span><div class="bar"><i style="width:${(a ? out[k] / a * 100 : 0).toFixed(1)}%"></i></div><span class="amt">${money(out[k], 2)}</span></div>`).join("");
      bg.querySelector("#r-note").textContent = `Sector ${phase.n} split.${phase.n === 0 ? " Emergency takes the first $500, salary takes the rest." : ""} ${note} Thin month: trim Invest, then Debt extra, then Emergency; never Tax or Giving.`;

/* ============================================================
   EVENTS
   ============================================================ */
function setTab(tab) {
  UI.tab = tab;
  try { localStorage.setItem("mazarus:ui:tab", tab); } catch (e) {}
  render(); window.scrollTo({ top: 0 });
}
document.getElementById("tabs").addEventListener("click", ev => { const b = ev.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
const ensureDay = d => S.days[d] || (S.days[d] = {});
const normFocus = day => { day.focus = (day.focus || []).concat([{}, {}, {}]).slice(0, 3).map(f => f || {}); };

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || !S.ready || el.closest("#sheet")) return;
  const act = el.dataset.act, t = todayISO();
  const before = computeXP();
  switch (act) {
    case "mission": missionSheet(el.dataset.id); break;
    case "gear": gearSheet(el.dataset.id); break;
    case "stone": stoneSheet(+el.dataset.n); break;
    case "journal": journalSheet(el.dataset.d); break;
    case "journalpick": { const v = document.getElementById("jdate").value; if (v && v <= t) journalSheet(v); break; }
    case "receipt": receiptSheet(); break;
    case "focusdone": {
      const day = ensureDay(t), i = +el.dataset.i; normFocus(day);
      if (!day.focus[i].t) { document.getElementById("focus-" + i).focus(); toast("Write the task first"); break; }
      day.focus[i] = { ...day.focus[i], done: !day.focus[i].done };
      saveDay(t); render(); if (day.focus[i].done) award(before, "Task done"); else resyncLevel(); break;
    }
    case "energy": { const day = ensureDay(t), n = +el.dataset.n; day.energy = day.energy === n ? 0 : n; saveDay(t); render(); award(before, "Energy logged"); break; }
    case "rest": { const day = ensureDay(t); day.rest = !day.rest; saveDay(t); render(); if (day.rest) award(before, "Rest day kept"); else resyncLevel(); break; }
    case "goweek": UI.jTab = "week"; UI.week = weekKey(t); setTab("journal"); break;
    case "gomonth": UI.jTab = "month"; UI.month = el.dataset.m; setTab("journal"); break;
    case "gomap": UI.mapPhase = +el.dataset.p; setTab("map"); break;
    case "phase": UI.mapPhase = +el.dataset.n; render(); break;
    case "jtab": UI.jTab = el.dataset.k; render(); break;
    case "week": UI.week = addDays(UI.week, +el.dataset.n); render(); break;
    case "month": UI.month = addMonths(UI.month, +el.dataset.n); render(); break;
    case "wcheck": case "wenergy": case "wdone": {
      const k = "w-" + UI.week, r = S.reviews[k] || (S.reviews[k] = {});
      if (act === "wcheck") r[el.dataset.id] = !r[el.dataset.id];
      if (act === "wenergy") { const n = +el.dataset.n; r.energy = r.energy === n ? 0 : n; }
      if (act === "wdone") r.done = !r.done;
      saveReview(k); render(); if (act === "wdone") { if (r.done) award(before, "Debrief complete"); else resyncLevel(); } break;
    }
    case "mcheck": case "mdone": {
      const k = "m-" + UI.month, r = S.reviews[k] || (S.reviews[k] = {});
      if (act === "mcheck") r[el.dataset.id] = !r[el.dataset.id];
      if (act === "mdone") r.done = !r.done;
      saveReview(k); render(); if (act === "mdone") { if (r.done) award(before, "Reflection complete"); else resyncLevel(); } break;
    }
    case "snap": {
      const v = id => document.getElementById(id).value.trim();
      S.state.snaps.push({ date: t, emergency: v("b-emergency"), debt: v("b-debt"), hub: v("b-hub"), net: v("b-net") });
      if (S.state.snaps.length > 400) S.state.snaps = S.state.snaps.slice(-400);
      saveState(0); render(); award(before, "Balances saved"); break;
    }
    case "gate": S.state.gates[el.dataset.g] = !S.state.gates[el.dataset.g]; saveState(300); render(); break;
    case "delreceipt": {
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Delete?"; el.style.color = "var(--bad)"; setTimeout(() => { if (el.isConnected) { el.dataset.confirm = ""; el.textContent = "✕"; el.style.color = ""; } }, 3000); break; }
      S.state.receipts = S.state.receipts.filter(r => r.id !== el.dataset.id); saveState(0); render(); resyncLevel(); break;
    }
    case "export": {
      const data = JSON.stringify({ app: "mazarus", version: 2, exported: new Date().toISOString(), state: S.state, days: S.days, reviews: S.reviews, records: S.records }, null, 2);
      let saved = false;
      try { const dl = window.claude && await window.claude.use("downloads"); if (dl) { await dl.save({ filename: `mazarus-backup-${t}.json`, data }); saved = true; toast("Backup saved"); } }
      catch (e) { if (e && e.code === "declined") return; }
      if (!saved) { try { await navigator.clipboard.writeText(data); toast("Backup copied to clipboard"); } catch (e) { toast("Backup could not be saved here"); } }
      break;
    }
  }
});

// Live status for the daily log without re-rendering, so typing keeps focus
function paintDailyLog() {
  const day = S.days[todayISO()] || {};
  const steps = dayLogSteps(day);
  document.querySelectorAll("#dailylog [data-step]").forEach(s => {
    const i = +s.dataset.step, ok = steps[i];
    s.classList.toggle("ok", ok);
    s.querySelector(".num").innerHTML = ok ? I.check : String(i + 1);
  });
  const pill = document.getElementById("logpill");
  if (pill) { const all = day.rest || steps.every(Boolean); pill.className = "pill " + (all ? "done" : "xp"); pill.textContent = all ? "Logged" : `${steps.filter(Boolean).length}/3 · +30`; }
}
let typingXP = null, typingTimer = null;
document.addEventListener("input", ev => {
  const el = ev.target;
  if (!S.ready || el.closest("#sheet")) return;
  if (el.dataset.day) {
    if (typingXP === null) typingXP = computeXP();
    const t = todayISO(), day = ensureDay(t);
    if (el.dataset.day === "focus") { normFocus(day); const i = +el.dataset.i; day.focus[i] = { ...day.focus[i], t: el.value }; }
    else day[el.dataset.day] = el.value;
    saveDay(t); paintDailyLog();
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { const b = typingXP; typingXP = null; if (computeXP() > b) award(b, "Daily log step"); else resyncLevel(); }, 1200);
  } else if (el.dataset.rev) {
    const k = UI.jTab === "week" ? "w-" + UI.week : "m-" + UI.month;
    const r = S.reviews[k] || (S.reviews[k] = {});
    r[el.dataset.rev] = el.value; saveReview(k);
  } else if (el.dataset.set) { S.state.settings[el.dataset.set] = el.value; saveState(); }
});

document.addEventListener("change", ev => {
  if (ev.target.id !== "importfile") return;
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (j.app !== "mazarus" || !j.state) throw 0;
      S.state = Object.assign(blankState(), j.state);
      S.days = j.days || {}; S.reviews = j.reviews || {}; S.records = j.records || {};
      saveState(0); COLLS.forEach(c => Object.keys(S[c]).forEach(id => saveIn(c, id, 0)));
      resyncLevel(); render(); toast("Backup restored");
    } catch (e) { toast("That file is not a Mazarus backup"); }
  };
  rd.readAsText(f);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
let lastToday = todayISO();
setInterval(() => { const t = todayISO(); if (t !== lastToday) { lastToday = t; softRender(); } }, 60000);

boot();
</script>
